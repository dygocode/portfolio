<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2C2C2A"/>
      <stop offset="100%" style="stop-color:#444441"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EF9F27"/>
      <stop offset="100%" style="stop-color:#FAC775"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative elements -->
  <circle cx="1000" cy="80" r="200" fill="#FAC775" opacity="0.06"/>
  <circle cx="200" cy="550" r="150" fill="#EF9F27" opacity="0.05"/>
  <!-- Arrow symbols representing agile sprints -->
  <g stroke="#EF9F27" stroke-width="3" fill="none" opacity="0.2">
    <path d="M850 300 L900 260 L950 300 L1000 260 L1050 300 L1100 260"/>
    <path d="M850 340 L900 300 L950 340 L1000 300 L1050 340 L1100 300"/>
  </g>
  <!-- Category badge -->
  <rect x="80" y="180" width="140" height="36" rx="18" fill="#EF9F27" opacity="0.15"/>
  <text x="150" y="204" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#EF9F27" text-anchor="middle">PROCESSOS</text>
  <!-- Title -->
  <text x="80" y="280" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#F1EFE8">
    <tspan x="80" dy="0">Métodos ágeis em</tspan>
    <tspan x="80" dy="58">projetos de</tspan>
    <tspan x="80" dy="58">Software: por que</tspan>
    <tspan x="80" dy="58">adotar?</tspan>
  </text>
  <rect x="80" y="540" width="80" height="4" rx="2" fill="url(#accent)"/>
  <text x="80" y="580" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FAC775" opacity="0.6">DYGO Sistemas Digitais</text>
</svg>