<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2C2C2A"/>
      <stop offset="100%" style="stop-color:#444441"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EF9F27"/>
      <stop offset="100%" style="stop-color:#FAC775"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- AI/neural network decorative nodes -->
  <g fill="none" stroke="#EF9F27" stroke-width="1.5" opacity="0.15">
    <circle cx="900" cy="200" r="8"/><circle cx="980" cy="160" r="8"/><circle cx="1060" cy="220" r="8"/>
    <circle cx="940" cy="300" r="8"/><circle cx="1020" cy="280" r="8"/><circle cx="1100" cy="320" r="8"/>
    <circle cx="880" cy="380" r="8"/><circle cx="960" cy="400" r="8"/><circle cx="1040" cy="360" r="8"/>
    <line x1="900" y1="200" x2="980" y2="160"/><line x1="980" y1="160" x2="1060" y2="220"/>
    <line x1="900" y1="200" x2="940" y2="300"/><line x1="980" y1="160" x2="1020" y2="280"/>
    <line x1="940" y1="300" x2="1020" y2="280"/><line x1="1020" y1="280" x2="1100" y2="320"/>
    <line x1="940" y1="300" x2="880" y2="380"/><line x1="940" y1="300" x2="960" y2="400"/>
    <line x1="1020" y1="280" x2="960" y2="400"/><line x1="1020" y1="280" x2="1040" y2="360"/>
    <line x1="1100" y1="320" x2="1040" y2="360"/>
  </g>
  <g fill="#FAC775" opacity="0.25">
    <circle cx="900" cy="200" r="4"/><circle cx="980" cy="160" r="4"/><circle cx="1060" cy="220" r="4"/>
    <circle cx="940" cy="300" r="4"/><circle cx="1020" cy="280" r="4"/><circle cx="1100" cy="320" r="4"/>
    <circle cx="880" cy="380" r="4"/><circle cx="960" cy="400" r="4"/><circle cx="1040" cy="360" r="4"/>
  </g>
  <circle cx="100" cy="500" r="180" fill="#FAC775" opacity="0.04"/>
  <!-- Category badge -->
  <rect x="80" y="180" width="160" height="36" rx="18" fill="#EF9F27" opacity="0.15"/>
  <text x="160" y="204" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#EF9F27" text-anchor="middle">TECNOLOGIA</text>
  <!-- Title -->
  <text x="80" y="280" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#F1EFE8">
    <tspan x="80" dy="0">Automação de</tspan>
    <tspan x="80" dy="58">processos com</tspan>
    <tspan x="80" dy="58">IA: o futuro já</tspan>
    <tspan x="80" dy="58">chegou</tspan>
  </text>
  <rect x="80" y="540" width="80" height="4" rx="2" fill="url(#accent)"/>
  <text x="80" y="580" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FAC775" opacity="0.6">DYGO Sistemas Digitais</text>
</svg>