<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C2C2A"/>
      <stop offset="100%" style="stop-color:#444441"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EF9F27"/>
      <stop offset="100%" style="stop-color:#FAC775"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="950" cy="120" r="180" fill="#EF9F27" opacity="0.08"/>
  <circle cx="1050" cy="500" r="120" fill="#FAC775" opacity="0.06"/>
  <circle cx="150" cy="520" r="200" fill="#EF9F27" opacity="0.05"/>
  <!-- Grid dots -->
  <g fill="#FAC775" opacity="0.15">
    <circle cx="80" cy="80" r="2"/><circle cx="120" cy="80" r="2"/><circle cx="160" cy="80" r="2"/><circle cx="200" cy="80" r="2"/>
    <circle cx="80" cy="120" r="2"/><circle cx="120" cy="120" r="2"/><circle cx="160" cy="120" r="2"/><circle cx="200" cy="120" r="2"/>
    <circle cx="80" cy="160" r="2"/><circle cx="120" cy="160" r="2"/><circle cx="160" cy="160" r="2"/><circle cx="200" cy="160" r="2"/>
    <circle cx="80" cy="200" r="2"/><circle cx="120" cy="200" r="2"/><circle cx="160" cy="200" r="2"/><circle cx="200" cy="200" r="2"/>
  </g>
  <!-- Category badge -->
  <rect x="80" y="200" width="130" height="36" rx="18" fill="#EF9F27" opacity="0.15"/>
  <text x="145" y="224" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#EF9F27" text-anchor="middle">ESTRATÉGIA</text>
  <!-- Title -->
  <text x="80" y="300" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#F1EFE8">
    <tspan x="80" dy="0">Por que ter uma</tspan>
    <tspan x="80" dy="58">Software House de</tspan>
    <tspan x="80" dy="58">confiança faz</tspan>
    <tspan x="80" dy="58">toda a diferença</tspan>
  </text>
  <!-- Accent line -->
  <rect x="80" y="540" width="80" height="4" rx="2" fill="url(#accent)"/>
  <!-- Brand -->
  <text x="80" y="580" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FAC775" opacity="0.6">DYGO Sistemas Digitais</text>
</svg>